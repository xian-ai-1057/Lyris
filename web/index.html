<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>Lyris · 動態歌詞播放器</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♪</text></svg>">
</head>
<body>

<!-- 背景：封面放大模糊 + 兩顆會飄的色團 -->
<div class="ambient" aria-hidden="true">
  <div class="ambient__art" id="ambientArt"></div>
  <div class="ambient__blob ambient__blob--a"></div>
  <div class="ambient__blob ambient__blob--b"></div>
  <div class="ambient__grain"></div>
</div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </span>
      <span class="brand__name">Lyris</span>
    </div>
    <div class="topbar__actions">
      <button class="icon-btn" id="btnLibrary" aria-label="曲目清單" title="曲目清單（L）">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 6h11M4 12h11M4 18h7M19 5v9.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17.4" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="icon-btn__label">曲目</span>
      </button>
    </div>
  </header>

  <main class="stage">

    <!-- 左：唱片 + 控制 -->
    <section class="deck">
      <div class="cover" id="cover">
        <div class="cover__inner">
          <img id="coverImg" alt="" hidden>
          <div class="cover__placeholder" id="coverFallback">
            <svg viewBox="0 0 24 24" width="38" height="38"><path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="16.5" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </div>
        </div>
        <div class="cover__shine" aria-hidden="true"></div>
      </div>

      <div class="now">
        <h1 class="now__title" id="trackTitle">尚未選擇歌曲</h1>
        <p class="now__artist" id="trackArtist">把 mp3 和 lrc 丟進 media 資料夾</p>
      </div>

      <div class="scrub" id="scrub" role="slider" tabindex="0"
           aria-label="播放進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="scrub__rail">
          <div class="scrub__buffer" id="scrubBuffer"></div>
          <div class="scrub__fill" id="scrubFill"><span class="scrub__knob"></span></div>
        </div>
        <div class="scrub__times">
          <span id="timeNow">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl" id="btnPrev" aria-label="上一首">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M18 6v12L9 12zM6 5.5v13" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
        <button class="ctrl ctrl--play" id="btnPlay" aria-label="播放">
          <svg class="ico-play" viewBox="0 0 24 24" width="24" height="24"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" width="24" height="24"><path d="M9 5.5v13M15 5.5v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button class="ctrl" id="btnNext" aria-label="下一首">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6v12l9-6zM18 5.5v13" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>

        <div class="controls__side">
          <button class="ctrl ctrl--ghost" id="btnVolume" aria-label="靜音切換">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path class="wave" d="M15.5 9.2a4 4 0 010 5.6M18 7a7.4 7.4 0 010 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
        </div>
      </div>
    </section>

    <!-- 右：歌詞 -->
    <section class="lyrics" id="lyrics">
      <div class="lyrics__viewport" id="lyricsViewport">
        <div class="lyrics__track" id="lyricsTrack"></div>
      </div>
      <div class="lyrics__empty" id="lyricsEmpty">
        <p class="lyrics__empty-title">還沒有歌詞</p>
        <p class="lyrics__empty-hint">把同名的 <code>.lrc</code> 放在 mp3 旁邊，或直接拖曳檔案到這個視窗。</p>
      </div>
      <button class="resume-pill" id="resumePill" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        回到播放位置
      </button>
    </section>
  </main>
</div>

<!-- 曲目清單抽屜 -->
<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="曲目清單">
  <div class="drawer__head">
    <h2>曲目<span class="drawer__count" id="trackCount">0</span></h2>
    <button class="icon-btn icon-btn--round" id="btnCloseDrawer" aria-label="關閉">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <ol class="tracklist" id="tracklist"></ol>
  <p class="drawer__hint">支援拖曳：把 mp3 / lrc 直接拉進視窗即可播放。</p>
</aside>

<!-- 拖放提示 -->
<div class="dropzone" id="dropzone" hidden>
  <div class="dropzone__card">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>放開就開始播放</p>
    <span>接受 .mp3 與 .lrc（同檔名會自動配對）</span>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
